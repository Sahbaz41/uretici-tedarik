<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161d"/>
      <stop offset="100%" stop-color="#0c0e13"/>
    </linearGradient>
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="iconNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Arka Plan Yuvarlak Kutu (App Icon Kasa) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#2563eb" stroke-opacity="0.4" stroke-width="4"/>

  <!-- Üst Siber Çizgi -->
  <rect x="96" y="36" width="320" height="4" rx="2" fill="#00f0ff" opacity="0.8" />

