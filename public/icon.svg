  <!-- Tipografi: ÜRETİCİ TEDARİK -->
  <text x="256" y="420" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" letter-spacing="1.5">
